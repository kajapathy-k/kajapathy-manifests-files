apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app-deployment
  labels:
    app: fitness-app
spec:
  replicas: 8

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 2

  selector:
    matchLabels:
      app: fitness-app

  template:
    metadata:
      labels:
        app: fitness-app
    spec:
      containers:
      - name: fitness-app-container
        image: muralisocial123/fitness-app:v1.0.1
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: fitness-app-deployment-svc
  namespace: kajapathy-ns
spec:
  selector:
    app: fitness-app
  ports:
    - port: 3001 # It is a service port number, we are using to expose the application to the internet
      targetPort: 5000
      protocol: TCP
  type: ClusterIP

